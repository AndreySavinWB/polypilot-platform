# Утренний будильник CEO: 9:00 Europe/Moscow = 06:00 UTC
name: Daily CEO morning brief

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send morning brief to CEO Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CEO_CHAT_ID: ${{ secrets.TELEGRAM_CEO_CHAT_ID }}
          DAILY_PUBLISH_START_DATE: ${{ secrets.DAILY_PUBLISH_START_DATE }}
        run: python scripts/daily_ceo_brief.py --send
