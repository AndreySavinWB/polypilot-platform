# Ежедневное напоминание CEO: готовый текст TG-поста в личку через бота.
name: Daily CEO publish reminder

on:
  schedule:
    # 07:00 UTC = 10:00 MSK (летнее) / 10:00 Москва зимой ≈ 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send daily brief to CEO Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CEO_CHAT_ID: ${{ secrets.TELEGRAM_CEO_CHAT_ID }}
          DAILY_PUBLISH_START_DATE: ${{ secrets.DAILY_PUBLISH_START_DATE }}
        run: python scripts/daily_publish.py --send
