# Ручной bootstrap Telegram: webhook + тестовый бриф CEO
name: Telegram bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set webhook + send CEO brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CEO_CHAT_ID: ${{ secrets.TELEGRAM_CEO_CHAT_ID }}
          PUBLIC_BACKEND_URL: ${{ secrets.PUBLIC_BACKEND_URL }}
          DAILY_PUBLISH_START_DATE: ${{ secrets.DAILY_PUBLISH_START_DATE }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from src.bot import config, telegram_api
          from src.bot.ceo_brief import send_morning_brief_to_ceo
          token = config.bot_token()
          base = os.getenv('PUBLIC_BACKEND_URL', '').rstrip('/')
          chat = os.getenv('TELEGRAM_CEO_CHAT_ID', '')
          assert token, 'TELEGRAM_BOT_TOKEN missing in GitHub secrets'
          assert base, 'PUBLIC_BACKEND_URL missing in GitHub secrets'
          assert chat, 'TELEGRAM_CEO_CHAT_ID missing in GitHub secrets'
          hook = base + '/api/telegram/webhook'
          print('setWebhook ->', hook)
          print(telegram_api.set_webhook(token, hook))
          print('send brief ->', chat)
          print(send_morning_brief_to_ceo())
          "
