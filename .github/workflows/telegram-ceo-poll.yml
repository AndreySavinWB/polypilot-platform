# Fallback: CEO bot commands via polling (если Railway env не подхватил webhook).
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CEO_CHAT_ID, DAILY_PUBLISH_START_DATE
name: Telegram CEO poll

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: backend/data/.telegram_ceo_poll_offset
          key: telegram-ceo-poll-offset-v1

      - name: Poll Telegram updates for CEO commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CEO_CHAT_ID: ${{ secrets.TELEGRAM_CEO_CHAT_ID }}
          DAILY_PUBLISH_START_DATE: ${{ secrets.DAILY_PUBLISH_START_DATE }}
        run: python scripts/telegram_ceo_poll_once.py
